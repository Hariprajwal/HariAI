[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hari-ai"
version = "0.2.0a5"
description = "HariAI: standalone local conversation and experimental typed decision models"
authors = [
    { name = "K R Hari Prajwal" }
]
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.20.0",
    "llama-cpp-python==0.3.8",
    "textual>=8.1.1,<9",
    "textual-image[textual]>=0.8.5,<0.9",
    "rich>=14.2.0,<15",
    "pillow>=9.0.0",
    "psutil>=5.9,<8",
]

[project.optional-dependencies]
desktop = [
    "mss>=9.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8",
]
keywords = ["ai", "transformer", "slm", "small-language-model", "decision-engine", "edge-ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Hariprajwal/HariAI"
Issues = "https://github.com/Hariprajwal/HariAI/issues"

[project.scripts]
hari = "hari_ai.cli.main:main"

[tool.setuptools.packages.find]
include = ["hari_ai*"]

[tool.setuptools.package-data]
hari_ai = ["assets/*.gguf", "assets/*.pt", "assets/*.json", "assets/*.md", "assets/*.png", "assets/LICENSE*", "vendor/open_jev/LICENSE", "vendor/open_jev/NOTICE.md"]
"hari_ai.cli" = ["*.tcss"]

