[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hari-ai"
version = "0.1.0"
description = "HariAI: Original, open-weight, extremely compact AI system under 50 MB"
authors = [
    { name = "K R Hari Prajwal", email = "hariprajwal77@gmail.com" }
]
readme = "plan.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0",
]
keywords = ["ai", "transformer", "slm", "small-language-model", "decision-engine", "edge-ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Hariprajwal"
LinkedIn = "https://www.linkedin.com/in/k-r-hari-prajwal-655373256/"

[project.scripts]
hari = "hari_ai.cli.main:main"

[tool.setuptools.packages.find]
include = ["hari_ai*"]

